<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ödeme Alındı — 3Doku</title>
<meta name="robots" content="noindex" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#F4F5F2; color:#0A2C42; font-family:'Inter',sans-serif; padding:24px;
  }
  .box{ max-width:420px; text-align:center; background:#fff; border:1px solid #E3E4DE; border-radius:18px; padding:40px 32px; }
  .icon{ width:56px; height:56px; border-radius:50%; background:#0072AC; color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 20px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 10px; }
  p{ font-size:14px; color:#4A555E; line-height:1.6; margin:0 0 24px; }
  a.btn{
    display:inline-block; background:#0A2C42; color:#fff; text-decoration:none;
    padding:12px 24px; border-radius:10px; font-weight:600; font-size:14px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✓</div>
    <h1>Ödemeniz alındı</h1>
    <p>Siparişiniz için teşekkür ederiz. Ödemeniz başarıyla tamamlandı, siparişinizi en kısa sürede hazırlayıp size ulaştıracağız. Sorularınız için WhatsApp'tan bize ulaşabilirsiniz.</p>
    <a class="btn" href="/">Anasayfaya Dön</a>
  </div>
</body>
</html>
