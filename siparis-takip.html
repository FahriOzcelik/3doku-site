<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A44;
    --ink-soft:#48577A;
    --paper:#EDEBE2;
    --paper-raised:#F7F5EE;
    --line:#D8D4C4;
    --gold:#C08A28;
    --gold-soft:#F3E4C2;
    --green:#3D7A5C;
    --green-soft:#DCEBE2;
    --blue:#3A6EA5;
    --blue-soft:#DDE7F1;
    --rust:#B5473A;
    --rust-soft:#F3DEDA;
    --shadow: 0 1px 2px rgba(30,42,68,0.06), 0 4px 14px rgba(30,42,68,0.06);
    --shadow-lift: 0 4px 10px rgba(30,42,68,0.10), 0 10px 24px rgba(30,42,68,0.10);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{box-sizing:border-box;}
  ::selection{ background: var(--gold-soft); color: var(--ink); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background: var(--paper); }
  ::-webkit-scrollbar-thumb{ background: #CFC9B5; border-radius:10px; border:2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover{ background: #B9B29A; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  /* ---------- Header / Ledger band ---------- */
  .ledger-head{
    background:var(--ink);
    color:var(--paper-raised);
    border-radius:14px;
    padding:26px 30px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:18px;
    position:relative;
    overflow:hidden;
  }
  .ledger-head::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 26px);
    pointer-events:none;
  }
  .brand{
    position:relative;
    z-index:1;
  }
  .brand .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 6px;
  }
  .brand h1{
    font-family:'Zilla Slab', serif;
    font-weight:700;
    font-size:30px;
    margin:0;
    line-height:1.1;
    outline:none;
    cursor:text;
  }
  .brand h1:hover{opacity:0.9;}
  .brand .sub{
    font-size:13px;
    color:#B9C2D8;
    margin-top:6px;
  }
  .stat-strip{
    display:flex;
    gap:10px;
    position:relative;
    z-index:1;
    flex-wrap:wrap;
  }
  .stat{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    padding:10px 16px;
    min-width:108px;
    transition:background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .stat:hover{background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.22); transform:translateY(-1px);}
  .stat .n{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    font-weight:600;
    color:#fff;
  }
  .stat .l{
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#AEB8CE;
    margin-top:2px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    margin:26px 0 16px;
    flex-wrap:wrap;
  }
  .search-wrap{
    position:relative;
    flex:1;
    min-width:220px;
  }
  .search-wrap input{
    width:100%;
    padding:11px 14px 11px 36px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    transition:border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .search-wrap input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft);}
  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.5;
  }
  select.status-filter{
    padding:11px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  select.status-filter:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft);}
  .btn-new{
    background:var(--ink);
    color:#fff;
    border:none;
    padding:11px 20px;
    border-radius:9px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background 0.18s var(--ease), transform 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  .btn-new:hover{background:#2C3B5E; transform:translateY(-1px); box-shadow:var(--shadow-lift);}
  .btn-new:active{transform:translateY(0); box-shadow:none;}
  .btn-new:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- View tabs ---------- */
  .view-tabs{
    display:flex;
    gap:6px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .view-tab{
    background:none;
    border:none;
    padding:10px 18px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:9px 9px 0 0;
    border-bottom:2px solid transparent;
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
    flex-shrink:0;
    transition:color 0.15s var(--ease), background 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .view-tab svg{flex-shrink:0; opacity:0.75;}
  .view-tab:hover{color:var(--ink); background:#E7E4D8;}
  .view-tab.active{color:var(--ink); border-bottom:2px solid var(--gold); background:var(--paper-raised);}
  .view-tab.active svg{opacity:1; color:var(--gold);}

  /* ---------- Chips / mini badges ---------- */
  .taken-chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--blue-soft);
    color:#2A5482;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:12.5px;
  }
  .pay-badge{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    margin-top:4px;
  }
  .pay-badge.full{background:var(--green-soft); color:#2A5F45;}
  .pay-badge.partial{background:var(--gold-soft); color:#8A6415;}
  .pay-badge.none{background:var(--rust-soft); color:#8F3428;}

  /* ---------- Finance view ---------- */
  .finance-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .fcard{
    background:var(--paper-raised);
    border-radius:12px;
    padding:16px 18px;
    box-shadow:var(--shadow);
    transition:transform 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  .fcard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift);}
  .fcard .fl{font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600;}
  .fcard .fn{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:700; margin-top:4px;}
  .fcard.income .fn{color:var(--green);}
  .fcard.expense .fn{color:var(--rust);}
  .fcard.net .fn{color:var(--ink);}
  .finance-section-title{
    font-family:'Zilla Slab', serif;
    font-size:18px;
    font-weight:600;
    margin:26px 0 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .net-pos{color:var(--green); font-weight:700;}
  .net-neg{color:var(--rust); font-weight:700;}

  /* ---------- Stok grupları ---------- */
  .stock-group{
    background:var(--paper-raised);
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:16px;
    transition:box-shadow 0.18s var(--ease);
  }
  .stock-group:hover{box-shadow:var(--shadow-lift);}
  .stock-group-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    padding:16px 18px;
    background:#F1EEE4;
    border-bottom:1px solid var(--line);
  }
  .stock-group-name{
    font-family:'Zilla Slab', serif;
    font-size:17px;
    font-weight:600;
  }
  .stock-group-metrics{
    display:flex;
    gap:18px;
    align-items:end;
    flex-wrap:wrap;
  }
  .sgm label{
    display:block;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:4px;
  }
  .sgm input{
    width:76px;
    padding:7px 9px;
    border-radius:7px;
    border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
  }
  .stock-color-table{
    width:100%;
    border-collapse:collapse;
  }
  .stock-color-table th{
    text-align:left;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    padding:10px 18px;
    border-bottom:1px solid var(--line);
  }
  .stock-color-table td{
    padding:10px 18px;
    font-size:13.5px;
    border-bottom:1px solid var(--line);
  }
  .stock-color-table tr:last-child td{border-bottom:none;}
  .stock-color-empty{
    padding:14px 18px;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* ---------- Maliyet Hesabı ---------- */
  .cost-calc-grid{
    display:grid;
    grid-template-columns:1.15fr 1fr;
    gap:16px;
    align-items:start;
  }
  @media (max-width:860px){
    .cost-calc-grid{ grid-template-columns:1fr; }
  }
  .cost-summary{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px 16px;
    margin-bottom:20px;
  }
  .cost-summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .cost-summary-row:last-child{border-bottom:none;}
  .cost-summary-row .amount{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--ink);
  }
  .cost-summary-row.total{
    font-weight:700;
    color:var(--ink);
  }
  .cost-summary-row.total .amount{font-size:15px;}
  .cost-summary-row.sale{
    font-family:'Zilla Slab',serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    padding-top:14px;
  }
  .cost-summary-row.sale .amount{
    font-size:22px;
    color:var(--green);
  }

  /* ---------- Table (ledger style) ---------- */
  .ledger-table{
    background:var(--paper-raised);
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    padding:14px 16px;
    border-bottom:2px solid var(--line);
    background:#F1EEE4;
  }
  tbody td{
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background 0.12s var(--ease);}
  tbody tr:hover{background:#F7F4EA;}
  .order-detail-row td{
    background:var(--paper);
    padding:0 !important;
    border-bottom:1px solid var(--line);
  }
  .order-detail-row:hover{background:transparent !important;}
  .order-detail-panel{
    padding:14px 20px 14px 42px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .order-detail-item{
    padding-bottom:10px;
    border-bottom:1px dashed var(--line);
  }
  .order-detail-item:last-child{border-bottom:none; padding-bottom:0;}
  .order-detail-item-main{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:5px;
  }
  .order-detail-item-colors{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
  }
  .order-no{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
    font-size:13px;
  }
  .cust-name{font-weight:600;}
  .cust-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .amount{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }
  .badge::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:currentColor;
  }
  .badge.beklemede{background:var(--gold-soft); color:#8A6415;}
  .badge.hazir{background:var(--blue-soft); color:#2A5482;}
  .badge.teslim{background:var(--green-soft); color:#2A5F45;}
  .row-actions{
    display:flex;
    gap:6px;
    justify-content:flex-end;
  }
  .icon-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:7px;
    width:30px;height:30px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    transition:all 0.15s var(--ease);
  }
  .icon-btn:hover{border-color:var(--ink-soft); color:var(--ink); background:var(--paper); transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0);}
  .icon-btn:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
  .icon-btn.danger:hover{border-color:var(--rust); color:var(--rust); background:var(--rust-soft);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state svg{
    color:#CFC9B5;
    margin-bottom:14px;
  }
  .empty-state .stamp{
    font-family:'Zilla Slab', serif;
    font-size:19px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .empty-state p{font-size:13.5px; margin:0;}

  /* ---------- Modal ---------- */
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalPop{ from{opacity:0; transform:translateY(10px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  .overlay{
    position:fixed; inset:0;
    background:rgba(30,42,68,0.45);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
    animation:fadeIn 0.15s var(--ease);
  }
  .modal{
    background:var(--paper-raised);
    border-radius:14px;
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(30,42,68,0.3);
    animation:modalPop 0.2s var(--ease);
  }
  .modal-head{
    padding:22px 26px 16px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head h2{
    font-family:'Zilla Slab', serif;
    font-size:21px;
    margin:0;
    font-weight:600;
  }
  .modal-close{
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    border-radius:7px;
  }
  .modal-close:hover{background:var(--paper);}
  .modal-body{padding:20px 26px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    transition:border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .item-row{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
    padding:12px;
    margin-bottom:10px;
  }
  .item-row select{
    width:100%;
    padding:9px 11px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
  }
  .item-row-grid{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    align-items:end;
  }
  .item-row-grid input{
    width:100%;
    padding:8px 10px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
  }
  .item-meta{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .color-dot{
    display:inline-block;
    width:10px;height:10px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,0.15);
    vertical-align:-1px;
    margin-right:2px;
    flex-shrink:0;
  }
  .color-dot-empty{
    background:transparent;
    border:1px dashed var(--ink-soft);
  }
  .color-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .color-row select{
    flex:1;
    padding:8px 10px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
    min-width:0;
  }
  .color-row input{
    width:64px;
    flex-shrink:0;
    padding:8px 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .color-row .icon-btn{
    flex-shrink:0;
    width:28px; height:28px;
  }
  .computed-box{
    padding:8px 10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:7px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13.5px;
  }
  .pick-order-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background 0.12s var(--ease);
  }
  .pick-order-row:last-child{border-bottom:none;}
  .pick-order-row:hover{background:var(--paper);}
  .production-row{
    cursor:grab;
    transition:background 0.12s;
  }
  .production-row:active{cursor:grabbing;}
  .production-row.dragging{
    opacity:0.4;
  }
  .production-row.drag-over{
    background:var(--gold-soft) !important;
    box-shadow: inset 0 2px 0 var(--gold);
  }
  .drag-handle{
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
  }
  .modal-foot{
    padding:16px 26px 24px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }
  .btn-secondary{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;

function migrateOrderItems(orders){
  return (orders||[]).map(o => {
    let items;
    if(Array.isArray(o.items) && o.items.length){
      items = o.items;
    } else if(o.product){
      // Eski tekil-ürün formatından çoklu-ürün formatına taşı
      items = [{
        id: 'it_' + Math.random().toString(36).slice(2,9),
        productId: null,
        productName: o.product,
        material: '',
        color: '',
        quantity: Number(o.quantity)||1,
        unitPrice: Number(o.unitPrice)||0,
      }];
    } else {
      items = [];
    }
    const orderStatus = migrateStatus(o.status);
    // Eski malzeme/renk serbest metin, tekil-renk ve renk-adet kombinasyonu alanlarını yeni sade yapıya taşı
    items = items.map(it => {
      let colors;
      let quantity;
      if(Array.isArray(it.colorBreakdown) && it.colorBreakdown.length){
        // Önceki "renk başına adet" sürümünden taşı: renkleri adetsiz listeye çevir, adetleri topla
        colors = it.colorBreakdown
          .filter(cb => cb.colorId)
          .map(cb => ({ id: cb.id || ('cl_' + Math.random().toString(36).slice(2,9)), colorId: cb.colorId, colorName: cb.colorName||'', colorHex: cb.colorHex||'' }));
        quantity = it.colorBreakdown.reduce((s,cb)=> s + (Number(cb.quantity)||0), 0) || Number(it.quantity) || 1;
      } else if(Array.isArray(it.colors)){
        colors = it.colors;
        quantity = Number(it.quantity) || 1;
      } else if(it.colorId){
        colors = [{ id:'cl_' + Math.random().toString(36).slice(2,9), colorId: it.colorId, colorName: it.colorName || it.color || '', colorHex: it.colorHex || '' }];
        quantity = Number(it.quantity) || 1;
      } else {
        colors = [];
        quantity = Number(it.quantity) || 1;
      }
      return {
        id: it.id || ('it_' + Math.random().toString(36).slice(2,9)),
        productId: it.productId ?? null,
        productName: it.productName || '',
        materialId: it.materialId ?? null,
        materialName: it.materialName !== undefined ? it.materialName : (it.material || ''),
        unitPrice: Number(it.unitPrice)||0,
        quantity,
        colors,
        status: migrateStatus(it.status || o.status),
        printerId: it.printerId ?? null,
        filamentDeducted: it.filamentDeducted || false,
        filamentDeductionSnapshot: it.filamentDeductionSnapshot || null,
        hoursLogged: it.hoursLogged || false,
        hoursLoggedSnapshot: it.hoursLoggedSnapshot || null,
      };
    });
    return {...o, items, status: orderStatus};
  });
}

async function loadData(){
  state.persistAvailable = storageUsable();

  if(state.persistAvailable){
    try{
      const res = await window.storage.get('orders', false);

    }catch(e){ state.orders = []; }
    try{

    }catch(e){ state.expenses = []; }
    try{
      const resProd = await window.storage.get('products', false);
      state.products = resProd ? JSON.parse(resProd.value) : [];
    }catch(e){ state.products = []; }
    try{
      const resMat = await window.storage.get('materials', false);
      state.materials = resMat ? JSON.parse(resMat.value) : [];
    }catch(e){ state.materials = []; }
    try{
      const resCol = await window.storage.get('colors', false);
      state.colors = resCol ? JSON.parse(resCol.value) : [];
    }catch(e){ state.colors = []; }
    try{
      const resPO = await window.storage.get('productionOrder', false);
      state.productionOrder = resPO ? JSON.parse(resPO.value) : [];
    }catch(e){ state.productionOrder = []; }
    try{
      const resSE = await window.storage.get('stockEntries', false);
      state.stockEntries = resSE ? JSON.parse(resSE.value) : [];
    }catch(e){ state.stockEntries = []; }
    try{
      const resFE = await window.storage.get('filamentEntries', false);
      state.filamentEntries = resFE ? JSON.parse(resFE.value) : [];
    }catch(e){ state.filamentEntries = []; }
    try{
      const resPR = await window.storage.get('printers', false);
      state.printers = resPR ? JSON.parse(resPR.value) : [];
    }catch(e){ state.printers = []; }
    try{
      const resFP = await window.storage.get('failedPrints', false);
      state.failedPrints = resFP ? JSON.parse(resFP.value) : [];
    }catch(e){ state.failedPrints = []; }
    try{
      const resCC = await window.storage.get('costCalc', false);
      if(resCC) state.costCalc = {...state.costCalc, ...JSON.parse(resCC.value)};
    }catch(e){ /* varsayılanları koru */ }
    try{
      const res2 = await window.storage.get('businessName', false);
      state.businessName = res2 ? res2.value : "3D Baskı Atölyem";
    }catch(e){ /* keep default */ }
    try{
      const res3 = await window.storage.get('orderSeq', false);
      state.orderSeq = res3 ? parseInt(res3.value,10) : (state.orders.length || 0);
    }catch(e){ state.orderSeq = state.orders.length || 0; }
  } else {
    // Kalıcı depolama bu ortamda yok (örn. dosya doğrudan tarayıcıda açıldı).
    // Oturum boyunca bellekte çalışmaya devam ediyoruz.
    state.orders = migrateOrderItems(state.orders || []);
    state.expenses = state.expenses || [];
    state.products = state.products || [];
    state.materials = state.materials || [];
    state.colors = state.colors || [];
    state.productionOrder = state.productionOrder || [];
    state.stockEntries = state.stockEntries || [];
    state.filamentEntries = state.filamentEntries || [];
    state.printers = state.printers || [];
    state.failedPrints = state.failedPrints || [];
    state.orderSeq = state.orders.length || 0;
    state.showPersistBanner = true;
  }

  state.loaded = true;
  render();
}

let __fileWriteTimer = null;
function scheduleFileWrite(){
  if(!state.autoBackupActive || !state.fileHandle) return;
  clearTimeout(__fileWriteTimer);
  __fileWriteTimer = setTimeout(writeToFileHandle, 350);

async function writeToFileHandle(){
  if(!state.fileHandle) return;
  try{
    const perm = await state.fileHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted'){
      const req = await state.fileHandle.requestPermission({mode:'readwrite'});
      if(req !== 'granted') throw new Error('izin verilmedi');
    }
    const payload = {
      businessName: state.businessName,
      orders: state.orders,
      expenses: state.expenses,
      products: state.products,
      materials: state.materials,
      colors: state.colors,
      productionOrder: state.productionOrder,
      stockEntries: state.stockEntries,
      filamentEntries: state.filamentEntries,
      printers: state.printers,
      failedPrints: state.failedPrints,
      costCalc: state.costCalc,
      orderSeq: state.orderSeq || 0,
      exportedAt: new Date().toISOString(),
    };
    const writable = await state.fileHandle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
  }catch(e){
    state.autoBackupActive = false;
    state.fileHandle = null;
    showToast("Otomatik yedekleme dosyasına yazılamadı, kapatıldı.");
    render();
  }
}

function itemQuantity(it){

}

function orderTotal(o){

// ---------- Otomatik Tüketim: Filament + Yazıcı Saati ----------
// Bir ürün "Hazır" veya "Teslim Edildi" olduğunda, o ürünün 1 adedi için tanımlı
// gram/saat bilgisi kullanılarak filament stoğundan otomatik düşülür ve (varsa)
// atanmış yazıcının toplam çalışma saatine eklenir. Durum geri alınırsa (ör. yanlışlıkla
// işaretlendiyse) aynı miktar otomatik olarak iade edilir.

function applyFilamentConsumption(item){
  if(item.filamentDeducted) return;
  const product = state.products.find(p=>p.id===item.productId);
  const gramPerUnit = product ? (Number(product.gramPerUnit)||0) : 0;
  const qty = itemQuantity(item);
  const totalGrams = qty * gramPerUnit;
  const snapshot = { materialId:item.materialId||null, materialName:item.materialName||'', totalGrams, colors:[] };
  if(item.materialId && totalGrams>0){
    const material = state.materials.find(m=>m.id===item.materialId);
    const matName = material ? material.name : (item.materialName||'');
    const colors = (item.colors||[]).filter(cl=>cl.colorId);
    if(colors.length === 0){
      state.filamentEntries.push({
        id:'fe_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        date: todayStr(), materialId:item.materialId, materialName:matName,
        colorId:null, colorName:'', colorHex:'',
        grams: -totalGrams, note:`Otomatik tüketim — ${item.productName||'ürün'} üretimi`
      });
      snapshot.colors.push({colorId:null, colorName:'', colorHex:'', grams: totalGrams});
    } else {
      const share = totalGrams/colors.length;
      colors.forEach(cl=>{
        state.filamentEntries.push({
          id:'fe_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+cl.colorId,
          date: todayStr(), materialId:item.materialId, materialName:matName,
          colorId:cl.colorId, colorName:cl.colorName, colorHex:cl.colorHex,
          grams: -share, note:`Otomatik tüketim — ${item.productName||'ürün'} üretimi`
        });
        snapshot.colors.push({colorId:cl.colorId, colorName:cl.colorName, colorHex:cl.colorHex, grams:share});
      });
    }
    saveFilamentEntries();
  }
  item.filamentDeducted = true;
  item.filamentDeductionSnapshot = snapshot;
}

function reverseFilamentConsumption(item){
  if(!item.filamentDeducted) return;
  const snap = item.filamentDeductionSnapshot;
  if(snap && snap.materialId && snap.colors && snap.colors.length){
    snap.colors.forEach(c=>{
      state.filamentEntries.push({
        id:'fe_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_rev',
        date: todayStr(), materialId:snap.materialId, materialName:snap.materialName,
        colorId:c.colorId, colorName:c.colorName, colorHex:c.colorHex,
        grams: c.grams, note:`Otomatik iade — ${item.productName||'ürün'} durumu geri alındı`
      });
    });
    saveFilamentEntries();
  }
  item.filamentDeducted = false;
  item.filamentDeductionSnapshot = null;
}

function applyPrinterHours(item){
  if(item.hoursLogged) return;
  if(!item.printerId) return; // yazıcı atanmadan loglanmaz; sonradan atanırsa tetiklenir
  const product = state.products.find(p=>p.id===item.productId);
  const hoursPerUnit = product ? (Number(product.printHoursPerUnit)||0) : 0;
  const qty = itemQuantity(item);
  const totalHours = qty * hoursPerUnit;
  if(totalHours>0){
    const idx = state.printers.findIndex(p=>p.id===item.printerId);
    if(idx>-1){
      state.printers[idx] = {...state.printers[idx], totalHours: (Number(state.printers[idx].totalHours)||0) + totalHours};
      savePrinters();
    }
  }
  item.hoursLogged = true;
  item.hoursLoggedSnapshot = { printerId:item.printerId, hours: totalHours };
}

function reversePrinterHours(item){
  if(!item.hoursLogged) return;
  const snap = item.hoursLoggedSnapshot;
  if(snap && snap.printerId && snap.hours>0){
    const idx = state.printers.findIndex(p=>p.id===snap.printerId);
    if(idx>-1){
      state.printers[idx] = {...state.printers[idx], totalHours: Math.max(0, (Number(state.printers[idx].totalHours)||0) - snap.hours)};
      savePrinters();
    }
  }
  item.hoursLogged = false;
  item.hoursLoggedSnapshot = null;
}

function onQueueItemPrinterChange(orderId, itemId, printerId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = (order.items||[]).find(it=>it.id===itemId);
  if(!item) return;
  item.printerId = printerId || null;
  if((item.status==='hazir'||item.status==='teslim') && !item.hoursLogged){
    applyPrinterHours(item);
  }
  saveOrders();
  render();
}

function computeStats(){
  const total = state.orders.length;
  const activeOrders = state.orders;
  const revenue = activeOrders.reduce((s,o)=> s + orderTotal(o), 0);
  const collected = activeOrders.reduce((s,o)=> s + (Number(o.paidAmount)||0), 0);
  const outstanding = Math.max(0, revenue - collected);
  const pendingOrders = state.orders.filter(o=>o.status!=='teslim');
  const pending = pendingOrders.length;
  // Bekleyen ürün adedi: sadece "Beklemede" durumundaki ürünler sayılır;
  // bir ürün Hazır veya Teslim Edildi olduğunda buradan otomatik düşer.
  let pendingUnits = 0;
  state.orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      if((it.status||'beklemede') === 'beklemede'){
        pendingUnits += itemQuantity(it);
      }
    });
  });
  const today = state.orders.filter(o=>o.orderDate===todayStr()).length;
  const totalUnits = activeOrders.reduce((s,o)=> s + orderUnits(o), 0);
  return {total, revenue, collected, outstanding, pending, pendingUnits, today, totalUnits};
}

function monthLabel(key){
  // key: 'YYYY-MM'
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString('tr-TR', {month:'long', year:'numeric'});
}

function computeMonthlySummary(){

  state.orders.forEach(o=>{
    const key = (o.orderDate||'').slice(0,7);
    if(!key) return;
    map[key] = map[key] || {gelir:0, gider:0};
    map[key].gelir += (Number(o.paidAmount)||0);

function computeCostCalc(){
  const c = state.costCalc;
  const grams = Number(c.filamentGrams)||0;
  const hours = Number(c.printHours)||0;
  const filamentCost = (grams/1000) * (Number(c.pricePerKg)||0);
  const electricityCost = hours * ((Number(c.printerWatts)||0)/1000) * (Number(c.electricityRate)||0);
  const machineCost = hours * (Number(c.machineHourRate)||0);
  const laborCost = hours * (Number(c.laborHourRate)||0);
  const subtotal = filamentCost + electricityCost + machineCost + laborCost;
  const failureAdd = subtotal * ((Number(c.failureMarginPct)||0)/100);
  const totalCost = subtotal + failureAdd;
  const salePrice = totalCost * (1 + (Number(c.profitMarginPct)||0)/100);
  const profit = salePrice - totalCost;
  return { filamentCost, electricityCost, machineCost, laborCost, subtotal, failureAdd, totalCost, salePrice, profit };
}

function computeFilamentStock(){
  const byMaterial = {}; // materialId -> { colorKey -> {colorId,colorName,colorHex,inGrams,outGrams} }
  state.filamentEntries.forEach(fe=>{
    const key = fe.colorId || '__none__';
    byMaterial[fe.materialId] = byMaterial[fe.materialId] || {};
    const bucket = byMaterial[fe.materialId];
    bucket[key] = bucket[key] || {colorId: fe.colorId||null, colorName: fe.colorId ? fe.colorName : 'Renksiz / Belirtilmemiş', colorHex: fe.colorHex||'', inGrams:0, outGrams:0};
    const g = Number(fe.grams)||0;
    if(g>=0) bucket[key].inGrams += g; else bucket[key].outGrams += Math.abs(g);
  });
  return state.materials.map(m=>{
    const bucket = byMaterial[m.id] || {};
    const colorRows = Object.values(bucket).map(v=>({
      colorId: v.colorId, colorName: v.colorName, colorHex: v.colorHex,
      stock: Math.round(v.inGrams*10)/10,
      consumed: Math.round(v.outGrams*10)/10,
      remaining: Math.round((v.inGrams - v.outGrams)*10)/10,
    })).sort((a,b)=> b.remaining - a.remaining);
    const totalStock = colorRows.reduce((s,c)=>s+c.stock,0);
    const totalConsumed = colorRows.reduce((s,c)=>s+c.consumed,0);
    const totalRemaining = colorRows.reduce((s,c)=>s+c.remaining,0);
    return { material:m, stock: Math.round(totalStock*10)/10, consumed: Math.round(totalConsumed*10)/10, remaining: Math.round(totalRemaining*10)/10, colorRows };
  });
}

function groupedFilamentEntries(){
  const map = {};
  state.filamentEntries.forEach(fe=>{
    const key = fe.materialId + '::' + (fe.colorId||'__none__');
    if(!map[key]){
      map[key] = {
        key, materialId: fe.materialId, materialName: fe.materialName,
        colorId: fe.colorId, colorName: fe.colorId ? fe.colorName : '', colorHex: fe.colorHex,
        netGrams: 0, count: 0, lastDate: fe.date, ids: [],
      };
    }
    const g = map[key];
    g.netGrams += Number(fe.grams)||0;
    g.count += 1;
    g.ids.push(fe.id);
    if((fe.date||'') > g.lastDate) g.lastDate = fe.date;
  });
  return Object.values(map).sort((a,b)=> (b.lastDate||'').localeCompare(a.lastDate||''));
}

// ---------- Gerçek Maliyet / Kârlılık ----------
function hourlyOperatingCost(){
  const c = state.costCalc;
  return ((Number(c.printerWatts)||0)/1000) * (Number(c.electricityRate)||0) + (Number(c.machineHourRate)||0) + (Number(c.laborHourRate)||0);
}
function computeItemRealCost(item){
  const product = state.products.find(p=>p.id===item.productId);
  if(!product) return 0;
  const qty = itemQuantity(item);
  const gramPerUnit = Number(product.gramPerUnit)||0;
  const hoursPerUnit = Number(product.printHoursPerUnit)||0;
  const material = item.materialId ? state.materials.find(m=>m.id===item.materialId) : null;
  const pricePerKg = material ? (Number(material.pricePerKg)||0) : 0;
  const materialCost = (gramPerUnit*qty/1000) * pricePerKg;
  const timeCost = hoursPerUnit * qty * hourlyOperatingCost();
  return materialCost + timeCost;
}
function computeProfitabilityReport(){
  const map = {};
  state.orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(!it.productId) return;
      const product = state.products.find(p=>p.id===it.productId);
      if(!product) return;
      map[it.productId] = map[it.productId] || { product, count:0, qty:0, revenue:0, cost:0 };
      const qty = itemQuantity(it);
      map[it.productId].count += 1;
      map[it.productId].qty += qty;
      map[it.productId].revenue += qty * (Number(it.unitPrice)||0);
      map[it.productId].cost += computeItemRealCost(it);
    });
  });
  return Object.values(map).map(v=>{
    const profit = v.revenue - v.cost;
    const marginPct = v.revenue>0 ? (profit/v.revenue*100) : 0;
    return { ...v, profit: Math.round(profit*100)/100, cost: Math.round(v.cost*100)/100, revenue: Math.round(v.revenue*100)/100, marginPct };
  }).sort((a,b)=> b.profit - a.profit);
}

function computeProductStock(){
  const orderedTotal = {};    // toplam sipariş edilen adet (tüm durumlar)
  const pendingTotal = {};    // sadece "Beklemede"
  const deliveredTotal = {};  // sadece "Teslim Edildi" — stoktan gerçekten düşen adet
  const orderedByColor = {}; // productId -> { colorKey -> {colorId, colorName, colorHex, ordered, pending, delivered} }
  state.orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(!it.productId) return;
      const qty = itemQuantity(it);
      const st = it.status||'beklemede';
      const isPending = st === 'beklemede';
      const isDelivered = st === 'teslim';
      orderedTotal[it.productId] = (orderedTotal[it.productId]||0) + qty;
      if(isPending) pendingTotal[it.productId] = (pendingTotal[it.productId]||0) + qty;
      if(isDelivered) deliveredTotal[it.productId] = (deliveredTotal[it.productId]||0) + qty;
      const colors = (it.colors||[]).filter(cl=>cl.colorId);
      orderedByColor[it.productId] = orderedByColor[it.productId] || {};
      const bucket = orderedByColor[it.productId];
      if(colors.length === 0){
        const key = '__none__';
        bucket[key] = bucket[key] || {colorId:null, colorName:'Renksiz / Belirtilmemiş', colorHex:'', ordered:0, pending:0, delivered:0};
        bucket[key].ordered += qty;
        if(isPending) bucket[key].pending += qty;
        if(isDelivered) bucket[key].delivered += qty;
      } else {
        const share = qty / colors.length;
        colors.forEach(cl=>{
          const key = cl.colorId;
          bucket[key] = bucket[key] || {colorId:cl.colorId, colorName:cl.colorName, colorHex:cl.colorHex, ordered:0, pending:0, delivered:0};
          bucket[key].ordered += share;
          if(isPending) bucket[key].pending += share;
          if(isDelivered) bucket[key].delivered += share;
        });
      }
    });
  });

  // Gerçek stok girişleri (müşterisiz eklenen stok) + eski tekil "Stok" alanı, renk bazında toplanır
  const stockByColor = {}; // productId -> { colorKey -> {colorId, colorName, colorHex, qty} }
  const addStock = (productId, key, qty, meta) => {
    if(!productId) return;
    stockByColor[productId] = stockByColor[productId] || {};
    const bucket = stockByColor[productId];
    bucket[key] = bucket[key] || {qty:0, ...meta};
    bucket[key].qty += qty;
  };
  state.products.forEach(p=>{
    const base = Number(p.stock)||0;
    if(base>0){
      addStock(p.id, '__none__', base, {colorId:null, colorName:'Renksiz / Belirtilmemiş', colorHex:''});
    }
  });
  state.stockEntries.forEach(se=>{
    const key = se.colorId || '__none__';
    addStock(se.productId, key, Number(se.quantity)||0, {
      colorId: se.colorId || null,
      colorName: se.colorId ? se.colorName : 'Renksiz / Belirtilmemiş',
      colorHex: se.colorHex || '',
    });
  });

  return state.products.map(p=>{
    const stockBucket = stockByColor[p.id] || {};
    const orderedBucket = orderedByColor[p.id] || {};
    const totalStock = Object.values(stockBucket).reduce((s,v)=> s+v.qty, 0);
    const orderedQty = orderedTotal[p.id]||0;
    const pendingQty = pendingTotal[p.id]||0;
    const deliveredQty = deliveredTotal[p.id]||0;
    // Kalan stok yalnızca Teslim Edildi olan ürünler için düşülür;
    // Beklemede/Hazır siparişler henüz stoktan çıkmamış sayılır.
    const remaining = totalStock - deliveredQty;

    const keys = new Set([...Object.keys(stockBucket), ...Object.keys(orderedBucket)]);
    const colorRows = Array.from(keys).map(key=>{
      const ob = orderedBucket[key] || {ordered:0, pending:0, delivered:0};
      const kb = stockBucket[key] || {qty:0};
      const meta = orderedBucket[key] || stockBucket[key] || {colorId: key==='__none__'?null:key, colorName:'Renksiz / Belirtilmemiş', colorHex:''};
      const colorStock = kb.qty || 0;
      const colorDelivered = ob.delivered || 0;
      const colorRemaining = colorStock - colorDelivered;
      return {
        colorId: meta.colorId,
        colorName: meta.colorName,
        colorHex: meta.colorHex,
        stock: Math.round(colorStock*10)/10,
        ordered: Math.round((ob.ordered||0)*10)/10,
        pending: Math.round((ob.pending||0)*10)/10,
        delivered: Math.round(colorDelivered*10)/10,
        remaining: Math.round(colorRemaining*10)/10,
      };
    }).sort((a,b)=> b.ordered - a.ordered || b.stock - a.stock);

    return { product:p, stock: totalStock, ordered:orderedQty, pending:pendingQty, delivered:deliveredQty, remaining, colorRows };
  });
}

function computeTakenBySummary(){
  const map = {};
  TAKEN_BY.forEach(t => { map[t] = {count:0, units:0, revenue:0, collected:0}; });
  state.orders.forEach(o=>{
    const key = o.takenBy || '-';
    if(!map[key]) map[key] = {count:0, units:0, revenue:0, collected:0};
    map[key].count++;
    map[key].units += orderUnits(o);
    map[key].revenue += orderTotal(o);
    map[key].collected += Number(o.paidAmount)||0;
  });
  return Object.entries(map).map(([taken,v])=>({
    taken,
    count:v.count,
    units:v.units,
    revenue:v.revenue,
    collected:v.collected,
    outstanding: Math.max(0, v.revenue - v.collected)
  }));
}

function filteredOrders(){
  let list = [...state.orders];
  if(state.statusFilter !== 'all'){
    list = list.filter(o=>o.status===state.statusFilter);
  }
  if(state.search.trim()){
    const q = state.search.trim().toLocaleLowerCase('tr-TR');
    list = list.filter(o =>
      o.customerName.toLocaleLowerCase('tr-TR').includes(q) ||
      (o.items||[]).some(it => (it.productName||'').toLocaleLowerCase('tr-TR').includes(q)) ||
      (o.orderNo||'').toLocaleLowerCase('tr-TR').includes(q)
    );
  }
  list.sort((a,b)=> (b.orderDate||'').localeCompare(a.orderDate||'') || (b.orderNo||'').localeCompare(a.orderNo||''));
  return list;
}

function getKnownCustomerNames(){
  // En son sipariş verilen müşteri en üstte olacak şekilde, tekrarsız müşteri adları
  const seen = new Map(); // name -> en güncel tarih
  state.orders.forEach(o=>{
    const name = (o.customerName||'').trim();
    if(!name) return;
    const date = o.orderDate || '';
    if(!seen.has(name) || date > seen.get(name)){
      seen.set(name, date);
    }
  });
  return Array.from(seen.entries())
    .sort((a,b)=> b[1].localeCompare(a[1]))
    .map(([name])=>name);
}

// ---------- Üretim Sırası ----------
function buildProductionQueue(){
  const allKeys = [];
  const itemMap = {};
  state.orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(state.productionFilter === 'active' && it.status === 'teslim') return;
      const key = o.id + '::' + it.id;
      allKeys.push(key);
      itemMap[key] = {order:o, item:it};
    });
  });
  const keySet = new Set(allKeys);
  const existing = state.productionOrder.filter(k=>keySet.has(k));
  const existingSet = new Set(existing);
  const newOnes = allKeys.filter(k=>!existingSet.has(k));
  let finalOrder = [...existing, ...newOnes];
  // Hazır ve Teslim Edildi olan ürünleri otomatik olarak alta indir (kendi aralarındaki sıra korunur)
  const sinkPriority = { beklemede:0, hazir:1, teslim:2 };
  finalOrder = finalOrder
    .map((k,i)=>({k, i, p: sinkPriority[itemMap[k].item.status] ?? 0}))
    .sort((a,b)=> a.p - b.p || a.i - b.i)
    .map(x=>x.k);
  const changed = finalOrder.length !== state.productionOrder.length || finalOrder.some((k,i)=>k!==state.productionOrder[i]);
  if(changed){
    state.productionOrder = finalOrder;
    saveProductionOrder();
  }
  return finalOrder.map(k=>({key:k, ...itemMap[k]}));
}

function moveProductionItem(key, direction){
  const idx = state.productionOrder.indexOf(key);
  if(idx<0) return;
  const newIdx = idx + direction;
  if(newIdx<0 || newIdx>=state.productionOrder.length) return;
  const arr = state.productionOrder;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  saveProductionOrder();
  render();
}
function moveProductionItemToTop(key){
  const idx = state.productionOrder.indexOf(key);
  if(idx<=0) return;
  state.productionOrder.splice(idx,1);
  state.productionOrder.unshift(key);
  saveProductionOrder();
  render();
}
function moveProductionItemToBottom(key){
  const idx = state.productionOrder.indexOf(key);
  if(idx<0 || idx===state.productionOrder.length-1) return;
  state.productionOrder.splice(idx,1);
  state.productionOrder.push(key);
  saveProductionOrder();
  render();
}

let __dragProductionKey = null;
function onProductionDragStart(e, key){
  __dragProductionKey = key;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', key); }catch(err){}
  e.currentTarget.classList.add('dragging');
}
function onProductionDragEnd(e){
  __dragProductionKey = null;
  document.querySelectorAll('.production-row.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.production-row.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function onProductionDragOver(e, key){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(key !== __dragProductionKey){
    e.currentTarget.classList.add('drag-over');
  }
}
function onProductionDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function onProductionDrop(e, targetKey){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const dragKey = __dragProductionKey;
  __dragProductionKey = null;
  if(!dragKey || dragKey === targetKey) return;
  const arr = state.productionOrder;
  const from = arr.indexOf(dragKey);
  const to = arr.indexOf(targetKey);
  if(from<0 || to<0) return;
  arr.splice(from,1);
  arr.splice(to,0,dragKey);
  saveProductionOrder();
  render();
}

}

function groupedStockEntries(){
  const map = {};
  state.stockEntries.forEach(se=>{
    const key = se.productId + '::' + (se.colorId||'__none__');
    if(!map[key]){
      map[key] = {
        key,
        productId: se.productId,
        productName: se.productName,
        colorId: se.colorId,
        colorName: se.colorId ? se.colorName : '',
        colorHex: se.colorHex,
        totalQuantity: 0,
        count: 0,
        firstDate: se.date,
        lastDate: se.date,
        notes: [],
        ids: [],
      };
    }
    const g = map[key];
    g.totalQuantity += Number(se.quantity)||0;
    g.count += 1;
    g.ids.push(se.id);
    if(se.note && !g.notes.includes(se.note)) g.notes.push(se.note);
    if((se.date||'') < g.firstDate) g.firstDate = se.date;
    if((se.date||'') > g.lastDate) g.lastDate = se.date;
  });
  return Object.values(map).sort((a,b)=> (b.lastDate||'').localeCompare(a.lastDate||''));
}

function computePrinterStats(){
  // Kuyrukta bekleyen (henüz teslim edilmemiş) toplam baskı saati, yazıcıya göre dağılımı
  const queueHoursByPrinter = {}; // printerId (veya '__unassigned__') -> saat
  state.orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(it.status === 'teslim') return;
      const product = state.products.find(p=>p.id===it.productId);
      const hoursPerUnit = product ? (Number(product.printHoursPerUnit)||0) : 0;
      if(hoursPerUnit<=0) return;
      const hours = itemQuantity(it) * hoursPerUnit;
      const key = it.printerId || '__unassigned__';
      queueHoursByPrinter[key] = (queueHoursByPrinter[key]||0) + hours;
    });
  });
  const printers = state.printers.map(p=>{
    const totalHours = Number(p.totalHours)||0;
    const lastMaint = Number(p.lastMaintenanceAtHours)||0;
    const interval = Number(p.maintenanceIntervalHours)||200;
    const sinceMaint = Math.max(0, totalHours - lastMaint);
    const ratio = interval>0 ? sinceMaint/interval : 0;
    const status = ratio>=1 ? 'due' : (ratio>=0.8 ? 'soon' : 'ok');
    const queueHours = Math.round((queueHoursByPrinter[p.id]||0)*10)/10;
    return { printer:p, totalHours: Math.round(totalHours*10)/10, sinceMaint: Math.round(sinceMaint*10)/10, interval, ratio, status, queueHours };
  });
  const unassignedHours = Math.round((queueHoursByPrinter['__unassigned__']||0)*10)/10;
  const totalQueueHours = Math.round(Object.values(queueHoursByPrinter).reduce((s,v)=>s+v,0)*10)/10;
  return { printers, unassignedHours, totalQueueHours };
}

  if(totalCost > 0){
    expenseId = 'e_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    state.expenses.push({ id:expenseId, date, description:`Başarısız Baskı — ${entry.productName}${reason?' ('+reason+')':''}`, amount: Math.round(totalCost*100)/100, person });
    await saveExpenses();
  }

  state.failedPrints.push({
    id:'fp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    date, productId:entry.productId, productName:entry.productName,
    materialId: material?material.id:null, materialName: material?material.name:'',
    colorId: color?color.id:null, colorName: color?color.name:'', colorHex: color?color.hex:'',
    gramsLost, hoursLost, reason, person,
    materialCost: Math.round(materialCost*100)/100,
    timeCost: Math.round(timeCost*100)/100,
    totalCost: Math.round(totalCost*100)/100,
    expenseId
  });
  await saveFailedPrints();
  showToast(`Başarısız baskı kaydedildi — ${fmtMoney(totalCost)} kayıp`);
  state.failedPrintModal = null;
  render();
}
function askDeleteFailedPrint(id){
  state.confirmDeleteFailedPrintId = id;
  render();
}
function cancelDeleteFailedPrint(){
  state.confirmDeleteFailedPrintId = null;
  render();
}
async function confirmDeleteFailedPrint(){
  const id = state.confirmDeleteFailedPrintId;
  const fp = state.failedPrints.find(x=>x.id===id);
  if(fp){
    if(fp.expenseId){
      state.expenses = state.expenses.filter(x=>x.id!==fp.expenseId);
      await saveExpenses();
    }
    state.failedPrints = state.failedPrints.filter(x=>x.id!==id);
    await saveFailedPrints();
    showToast("Başarısız baskı kaydı silindi.");
  }
  state.confirmDeleteFailedPrintId = null;
  render();
}

function exportBackup(){
  const payload = {
    businessName: state.businessName,
    orders: state.orders,
    expenses: state.expenses,
    products: state.products,
    materials: state.materials,
    colors: state.colors,
    productionOrder: state.productionOrder,
    stockEntries: state.stockEntries,
    filamentEntries: state.filamentEntries,
    printers: state.printers,
    failedPrints: state.failedPrints,
    costCalc: state.costCalc,
    orderSeq: state.orderSeq || 0,
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url;
  a.download = `siparis-yedek-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Yedek dosyası indirildi.");
}

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data.orders)) throw new Error('invalid');
      const doMerge = state.orders.length > 0
        ? confirm(`Defterde zaten ${state.orders.length} sipariş var. "Tamam" seçerseniz yedekteki ${data.orders.length} sipariş MEVCUT verilerin yerine geçecek. "İptal" seçerseniz işlem iptal edilir.`)
        : true;
      if(!doMerge){ event.target.value=''; return; }
      state.orders = migrateOrderItems(data.orders);
      state.expenses = Array.isArray(data.expenses) ? data.expenses : [];
      state.products = Array.isArray(data.products) ? data.products : [];
      state.materials = Array.isArray(data.materials) ? data.materials : [];
      state.colors = Array.isArray(data.colors) ? data.colors : [];
      state.productionOrder = Array.isArray(data.productionOrder) ? data.productionOrder : [];
      state.stockEntries = Array.isArray(data.stockEntries) ? data.stockEntries : [];
      state.filamentEntries = Array.isArray(data.filamentEntries) ? data.filamentEntries : [];
      state.printers = Array.isArray(data.printers) ? data.printers : [];
      state.failedPrints = Array.isArray(data.failedPrints) ? data.failedPrints : [];
      if(data.costCalc) state.costCalc = {...state.costCalc, ...data.costCalc};
      state.businessName = data.businessName || state.businessName;
      state.orderSeq = data.orderSeq || state.orders.length;
      await saveOrders();
      await saveExpenses();
      await saveProducts();
      await saveMaterials();
      await saveColors();
      await saveProductionOrder();
      await saveStockEntries();
      await saveFilamentEntries();
      await savePrinters();
      await saveFailedPrints();
      saveCostCalc();
      await saveBusinessName();
      await saveSeq();
      showToast(`Yedek yüklendi — ${data.orders.length} sipariş.`);
      render();
    }catch(err){
      showToast("Dosya okunamadı. Geçerli bir yedek dosyası seçin.");
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function renderPickOrderModal(){

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="loading-note">Sipariş defteri yükleniyor…</div>`;
    return;
  }

  // Yeniden çizim öncesi kaydırma ve odak (imleç) konumunu kaydet,
  // böylece kullanıcı yazarken sayfa üste sıçramaz / imleç kaybolmaz.
  const __scrollX = window.scrollX;
  const __scrollY = window.scrollY;
  const __active = document.activeElement;
  let __activeId = null, __selStart = null, __selEnd = null;
  if(__active && __active.id && app.contains(__active)){
    __activeId = __active.id;
    if(typeof __active.selectionStart === 'number'){
      __selStart = __active.selectionStart;
      __selEnd = __active.selectionEnd;
    }
  }
  const __prevModal = app.querySelector('.modal');
  const __modalScrollTop = __prevModal ? __prevModal.scrollTop : null;

  const stats = computeStats();

  app.innerHTML = `
    <div class="ledger-head">
      <div class="brand">
        <p class="eyebrow">Sipariş Defteri</p>
        <h1 contenteditable="true" spellcheck="false" onblur="onBusinessNameEdit(this)" title="Düzenlemek için tıklayın">${escapeHtml(state.businessName)}</h1>
        <p class="sub">Siparişlerinizi tek yerden takip edin</p>
      </div>
      ${state.showPersistBanner && !state.autoBackupActive ? `
      <div style="background:rgba(192,138,40,0.16); border:1px solid rgba(192,138,40,0.35); color:#F3E4C2; border-radius:8px; padding:11px 14px; font-size:12.5px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:center; position:relative; z-index:1;">
        <span>Bu görünümde kalıcı otomatik kayıt yok.${fsaSupported() ? ' Aşağıdan bir dosya seçerek otomatik yedeklemeyi açabilirsiniz:' : ' Değişiklikleri kaybetmemek için düzenli olarak yedek indirin.'}</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${fsaSupported() ? `
            <button onclick="enableAutoBackupNew()" style="background:#C08A28; color:#1E2A44; border:none; padding:7px 12px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer;">Yeni Dosyayla Başlat</button>
            <button onclick="enableAutoBackupConnect()" style="background:none; color:#F3E4C2; border:1px solid rgba(243,228,194,0.5); padding:7px 12px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer;">Var Olan Dosyaya Bağlan</button>
          ` : ''}
          <button onclick="state.showPersistBanner=false; render();" style="background:none;border:none;color:inherit;cursor:pointer;font-size:16px;line-height:1;">×</button>
        </div>
      </div>` : ''}
      ${state.autoBackupActive ? `
      <div style="background:rgba(61,122,92,0.18); border:1px solid rgba(61,122,92,0.4); color:#DCEBE2; border-radius:8px; padding:9px 14px; font-size:12.5px; display:flex; justify-content:space-between; gap:12px; align-items:center; position:relative; z-index:1;">
        <span>🟢 Otomatik yedekleme açık — değişiklikler <strong>${escapeHtml(state.autoBackupName)}</strong> dosyasına kaydediliyor.</span>
        <button onclick="disableAutoBackup()" style="background:none;border:1px solid rgba(220,235,226,0.5);color:inherit;cursor:pointer;font-size:11.5px;padding:4px 10px;border-radius:6px;">Kapat</button>
      </div>` : ''}
      <div class="stat-strip">
        <div class="stat"><div class="n">${stats.total}</div><div class="l">Toplam Sipariş</div></div>
        <div class="stat"><div class="n">${stats.pending}</div><div class="l">Bekleyen</div></div>
        <div class="stat"><div class="n">${stats.totalUnits}</div><div class="l">Toplam Ürün Adedi</div></div>
        <div class="stat"><div class="n">${stats.pendingUnits}</div><div class="l">Bekleyen Ürün Adedi</div></div>
        <div class="stat"><div class="n">${fmtMoney(stats.revenue)}</div><div class="l">Toplam Gelir</div></div>
        <div class="stat"><div class="n">${fmtMoney(stats.collected)}</div><div class="l">Tahsil Edilen</div></div>
        <div class="stat"><div class="n">${fmtMoney(stats.outstanding)}</div><div class="l">Kalan Alacak</div></div>
      </div>
    </div>

    <div class="view-tabs">
      <button class="view-tab ${state.view==='orders'?'active':''}" onclick="switchView('orders')">${iconClipboard()} Siparişler</button>
      <button class="view-tab ${state.view==='production'?'active':''}" onclick="switchView('production')">${iconLayers()} Üretim Sırası</button>
      <button class="view-tab ${state.view==='printers'?'active':''}" onclick="switchView('printers')">${iconPrinter()} Yazıcılar</button>
      <button class="view-tab ${state.view==='products'?'active':''}" onclick="switchView('products')">${iconBox()} Ürünler</button>

    </div>

    ${state.view === 'orders' ? renderOrdersView()
      : state.view === 'production' ? renderProductionView()
      : state.view === 'printers' ? renderPrintersView()
      : state.view === 'products' ? renderProductsView()
      : state.view === 'stock' ? renderStockView()
      : state.view === 'materials' ? renderMaterialsView()
      : state.view === 'colors' ? renderColorsView()
      : state.view === 'costcalc' ? renderCostCalcView()
      : state.view === 'failedprints' ? renderFailedPrintsView()
      : state.view === 'profitability' ? renderProfitabilityView()
      : state.view === 'partnership' ? renderPartnershipView()
      : renderFinanceView()}

    ${renderModal()}
    ${renderConfirm()}
    ${renderExpenseModal()}
    ${renderConfirmExpense()}
    ${renderProductModal()}
    ${renderConfirmProduct()}
    ${renderMaterialModal()}
    ${renderConfirmMaterial()}
    ${renderColorModal()}
    ${renderConfirmColor()}
    ${renderStockEntryModal()}
    ${renderConfirmStockEntry()}
    ${renderConfirmStockEntryGroup()}
    ${renderConfirmStockColorRow()}

    ${renderFilamentEntryModal()}

    ${renderConfirmFilamentColorRow()}
    ${renderPrinterModal()}
    ${renderConfirmPrinter()}
    ${renderFailedPrintModal()}

    const __el = document.getElementById(__activeId);
    if(__el){
      __el.focus({preventScroll:true});
      if(__selStart !== null && typeof __el.setSelectionRange === 'function'){
        try{ __el.setSelectionRange(__selStart, __selEnd); }catch(e){}
      }
    }
  }
}

function paymentBadge(o){
  const total = orderTotal(o);
  const paid = Number(o.paidAmount)||0;
  if(paid<=0) return `<span class="pay-badge none">Ödenmedi</span>`;
  if(paid >= total) return `<span class="pay-badge full">Ödendi</span>`;
  return `<span class="pay-badge partial">Kısmi (${fmtMoney(paid)})</span>`;
}

function toggleOrderExpand(orderId){
  if(state.expandedOrders.has(orderId)) state.expandedOrders.delete(orderId);
  else state.expandedOrders.add(orderId);
  render();
}

function itemsSummary(o){
  const items = o.items||[];
  if(items.length === 0) return '<span style="color:var(--ink-soft);">-</span>';
  const isOpen = state.expandedOrders.has(o.id);
  const totalQty = orderUnits(o);
  const label = `${totalQty} ürün`;
  return `
    <button type="button" onclick="toggleOrderExpand('${o.id}')" style="background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:center; gap:5px; font:inherit; color:inherit; text-align:left;">
      <span style="color:var(--ink-soft); transition:transform 0.15s var(--ease); transform:rotate(${isOpen?90:0}deg); display:inline-flex; flex-shrink:0;">${iconChevronRight()}</span>
      <span>${label}</span>
    </button>
  `;
}

function renderFailedPrintsView(){
  const list = [...state.failedPrints].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const totalGrams = state.failedPrints.reduce((s,x)=>s+(Number(x.gramsLost)||0),0);
  const totalHours = state.failedPrints.reduce((s,x)=>s+(Number(x.hoursLost)||0),0);
  const totalCost = state.failedPrints.reduce((s,x)=>s+(Number(x.totalCost)||0),0);

  let successfulCost = 0;
  state.orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(it.status==='hazir' || it.status==='teslim'){
        successfulCost += computeItemRealCost(it);
      }
    });
  });
  const denom = successfulCost + totalCost;
  const realizedFireRate = denom>0 ? (totalCost/denom*100) : 0;

  return `
    <div class="toolbar">
      <div style="flex:1; font-size:13px; color:var(--ink-soft);">Başarısız baskıları kaydedin — filament stoğundan otomatik düşülür ve giderlere otomatik yansır.</div>
      <button class="btn-new" onclick="openNewFailedPrintModal()">${iconPlus()} Başarısız Baskı Ekle</button>
    </div>

    <div class="finance-cards" style="margin-bottom:6px;">
      <div class="fcard expense"><div class="fl">Toplam Kayıp Filament</div><div class="fn">${Math.round(totalGrams*10)/10} g</div></div>
      <div class="fcard expense"><div class="fl">Toplam Kayıp Süre</div><div class="fn">${Math.round(totalHours*10)/10} sa</div></div>
      <div class="fcard expense"><div class="fl">Toplam Maliyet Kaybı</div><div class="fn">${fmtMoney(totalCost)}</div></div>
      <div class="fcard"><div class="fl">Gerçekleşen Fire Oranı</div><div class="fn">%${realizedFireRate.toFixed(1)}</div></div>
    </div>
    <p style="font-size:12px; color:var(--ink-soft); margin:6px 0 20px;">Karşılaştırma: Maliyet Hesabı'nda varsayılan fire payı %${state.costCalc.failureMarginPct||0} olarak ayarlı — gerçekleşen oran belirgin şekilde farklıysa orayı güncellemeyi düşünebilirsiniz.</p>

    <div class="ledger-table">
      ${list.length===0 ? `
        <div class="empty-state">${iconInbox()}<p class="stamp">Kayıt yok</p><p>Başarısız bir baskı olduğunda buradan kaydedin.</p></div>
      ` : `
      <table>
        <thead>
          <tr><th>Tarih</th><th>Ürün</th><th>Malzeme/Renk</th><th>Kayıp Gram</th><th>Kayıp Saat</th><th>Maliyet</th><th>Sebep</th><th></th></tr>
        </thead>
        <tbody>
          ${list.map(fp => `
            <tr>
              <td data-label="Tarih">${fmtDate(fp.date)}</td>
              <td data-label="Ürün" class="cust-name">${escapeHtml(fp.productName)}</td>
              <td data-label="Malzeme/Renk">${fp.materialName?escapeHtml(fp.materialName):'<span style="color:var(--ink-soft);">-</span>'}${fp.colorName?` — ${fp.colorHex?`<span class="color-dot" style="background:${escapeAttr(fp.colorHex)};"></span>`:''}${escapeHtml(fp.colorName)}`:''}</td>
              <td data-label="Kayıp Gram"><span class="amount">${fp.gramsLost} g</span></td>
              <td data-label="Kayıp Saat"><span class="amount">${fp.hoursLost} sa</span></td>
              <td data-label="Maliyet"><span class="amount" style="color:var(--rust);">${fmtMoney(fp.totalCost)}</span></td>
              <td data-label="Sebep">${escapeHtml(fp.reason||'-')}</td>
              <td data-label="">

                </div>
              </td>

        </tbody>
      </table>

// ============================================================
// KAR PAYLAŞIM MODÜLÜ — F, H, Sipariş Alan (%50/%25/%25)
// ============================================================

// Ortak tanımları (isimleri kolayca değiştirmek için)
const PARTNER = {
  F: 'F (Üretici)',
  H: 'H (Sermaye)'
};

function computePartnershipReport(filterMonth){
  // filterMonth: 'YYYY-MM' formatında (örn '2026-08'), null ise tüm zamanlar

  const inMonth = (dateStr) => {
    if(!filterMonth) return true;
    return (dateStr||'').startsWith(filterMonth);
  };

  // 1) Teslim edilmiş siparişlerden gelir + sipariş alanlar
  let totalRevenue = 0;
  const orderLines = []; // { orderNo, customerName, revenue, takenBy }

  state.orders.forEach(o => {
    if(o.status !== 'teslim') return; // sadece teslim edilmiş
    if(!inMonth(o.orderDate)) return;
    const revenue = Number(o.paidAmount) || 0;
    totalRevenue += revenue;
    orderLines.push({
      orderNo: o.orderNo,
      customerName: o.customerName,
      revenue,
      takenBy: (o.takenBy || '').trim() || null
    });
  });

  // 2) Tüm giderler (filament, fire dahil)
  let totalExpenses = 0;
  const expenseLines = [];

  // Normal giderler
  state.expenses.forEach(ex => {
    if(!inMonth(ex.date)) return;
    const amt = Number(ex.amount) || 0;
    totalExpenses += amt;
    expenseLines.push({
      date: ex.date,
      description: ex.description,
      amount: amt,
      person: ex.person || '-'
    });
  });

  // Başarısız baskılar (fire) — gider olarak sayılır
  state.failedPrints && state.failedPrints.forEach(fp => {
    if(!inMonth(fp.date)) return;
    // Tahmini maliyet: gram kaybı + saat kaybı
    const mat = state.materials && state.materials.find(m => m.id === fp.materialId);
    const pricePerKg = mat ? (Number(mat.pricePerKg)||0) : 0;
    const gramsLost = Number(fp.gramsLost) || 0;
    const hoursLost = Number(fp.hoursLost) || 0;
    const materialLoss = (gramsLost / 1000) * pricePerKg;
    const timeLoss = hoursLost * hourlyOperatingCost();
    const total = materialLoss + timeLoss;
    if(total <= 0) return;
    totalExpenses += total;
    expenseLines.push({
      date: fp.date,
      description: `Fire: ${fp.productName || '?'} (${gramsLost}g, ${hoursLost}sa)`,
      amount: total,
      person: 'F' // fire üreticide
    });
  });

  // 3) Net kar
  const netProfit = totalRevenue - totalExpenses;

  // 4) Kişi başı işçilik (ücret) = F'e yazılan giderler içindeki işçilik
  // (Sistem giderleri zaten kişiye göre bölünmüş durumda)

  // 5) Kar paylaşımı hesabı
  // Her sipariş için:
  //   - Siparişi alan belli -> o kişi %50, diğerleri %25
  //   - Belli değil -> 3'e eşit (%33.33)
  const shares = { F: 0, H: 0, ALAN: 0, ALAN_NAME: {} };

  orderLines.forEach(ol => {
    const orderShare = netProfit === 0 ? 0 : (ol.revenue / (totalRevenue || 1)) * netProfit;
    const taken = ol.takenBy;
    const knownPartners = ['F', 'H'];
    const isKnownPartner = taken && knownPartners.includes(taken);
    const isOther = taken && !isKnownPartner; // F veya H dışında biri aldıysa

    if(!taken || (!isKnownPartner && !isOther)){
      // Belli değil — 3'e böl
      shares.F += orderShare * (1/3);
      shares.H += orderShare * (1/3);
      shares.ALAN += orderShare * (1/3);
      const k = 'Belirsiz';
      shares.ALAN_NAME[k] = (shares.ALAN_NAME[k]||0) + orderShare * (1/3);
    } else {
      // F veya H aldıysa o kişi %50, diğer partner %25, "3. kişi" %25
      const takerShare = orderShare * 0.5;
      const otherPartnerShare = orderShare * 0.25;
      const thirdShare = orderShare * 0.25;

      if(taken === 'F'){
        shares.F += takerShare + otherPartnerShare; // F hem üretici hem alan
        shares.H += otherPartnerShare;
        shares.ALAN += thirdShare;
        shares.ALAN_NAME['F'] = (shares.ALAN_NAME['F']||0) + thirdShare;
      } else if(taken === 'H'){
        shares.H += takerShare;
        shares.F += otherPartnerShare; // F üretici olarak
        shares.ALAN += thirdShare;
        const k = 'H';
        shares.ALAN_NAME[k] = (shares.ALAN_NAME[k]||0) + thirdShare;
      } else {
        // Başka biri (örn. 'A') aldı
        shares.F += otherPartnerShare;
        shares.H += otherPartnerShare;
        shares.ALAN += takerShare;
        shares.ALAN_NAME[taken] = (shares.ALAN_NAME[taken]||0) + takerShare;
      }
    }
  });

  return {
    totalRevenue,
    totalExpenses,
    netProfit,
    shares,
    orderLines,
    expenseLines
  };
}

function renderPartnershipView(){
  const months = [];
  const seen = new Set();
  [...state.orders, ...state.expenses].forEach(r => {
    const d = r.orderDate || r.date || '';
    const m = d.slice(0,7);
    if(m && !seen.has(m)){ seen.add(m); months.push(m); }
  });
  months.sort((a,b) => b.localeCompare(a));

  const selectedMonth = state.partnershipMonth || (months[0] || null);
  const r = computePartnershipReport(selectedMonth);

  const monthLabel = selectedMonth
    ? new Date(selectedMonth+'-01').toLocaleDateString('tr-TR',{year:'numeric',month:'long'})
    : 'Tüm Zamanlar';

  const alanBreakdown = Object.entries(r.shares.ALAN_NAME)
    .map(([k,v]) => `<span class="taken-chip">${escapeHtml(k)}</span> ${fmtMoney(v)}`)
    .join(', ') || '—';

  return `
    <div class="toolbar">
      <div style="font-size:13px; font-weight:600; flex:1;">Ortaklık Kar Paylaşımı</div>
      <select onchange="state.partnershipMonth=this.value;render();" style="border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; background:#fff; cursor:pointer;">
        <option value="">Tüm Zamanlar</option>
        ${months.map(m => `<option value="${m}" ${m===selectedMonth?'selected':''}>${new Date(m+'-01').toLocaleDateString('tr-TR',{year:'numeric',month:'long'})}</option>`).join('')}
      </select>
    </div>

    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 20px;">
      Sadece <strong>teslim edilmiş</strong> siparişler gelir olarak sayılır. Filament, fire ve tüm giderler düşüldükten sonraki net kar paylaşılır.
      Siparişi alan belli ise <strong>%50</strong>, diğer iki ortak <strong>%25</strong> alır. Alan belli değilse kar üçe eşit bölünür.
    </p>

    <div class="finance-cards" style="margin-bottom:20px;">
      <div class="fcard income"><div class="fl">Toplam Gelir <span style="font-size:11px; opacity:.7;">(teslim)</span></div><div class="fn">${fmtMoney(r.totalRevenue)}</div></div>
      <div class="fcard expense"><div class="fl">Toplam Gider + Fire</div><div class="fn">${fmtMoney(r.totalExpenses)}</div></div>
      <div class="fcard net"><div class="fl">Net Kar (Paylaşılacak)</div><div class="fn ${r.netProfit>=0?'net-pos':'net-neg'}">${fmtMoney(r.netProfit)}</div></div>
    </div>

    <div class="finance-section-title">Kişi Payları — ${escapeHtml(monthLabel)}</div>
    <div class="ledger-table" style="margin-bottom:24px;">
      <table>
        <thead><tr><th>Ortak</th><th>Rol</th><th>Pay Oranı</th><th>Tutar</th></tr></thead>
        <tbody>
          <tr>
            <td><span class="taken-chip">F</span></td>
            <td style="font-size:13px; color:var(--ink-soft);">Üretici + Sermaye</td>
            <td>Değişken</td>
            <td><span class="amount net-pos">${fmtMoney(r.shares.F)}</span></td>
          </tr>
          <tr>
            <td><span class="taken-chip">H</span></td>
            <td style="font-size:13px; color:var(--ink-soft);">Sermaye</td>
            <td>Değişken</td>
            <td><span class="amount net-pos">${fmtMoney(r.shares.H)}</span></td>
          </tr>
          <tr>
            <td><span class="taken-chip">Sipariş Alan</span></td>
            <td style="font-size:13px; color:var(--ink-soft);">${alanBreakdown}</td>
            <td>%50 (alan) / ⅓ (belirsiz)</td>
            <td><span class="amount net-pos">${fmtMoney(r.shares.ALAN)}</span></td>
          </tr>
          <tr style="background:var(--gold-soft);">
            <td colspan="3"><strong>Toplam</strong></td>
            <td><span class="amount">${fmtMoney(r.shares.F + r.shares.H + r.shares.ALAN)}</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="finance-section-title">Sipariş Detayı (Teslim Edilenler)</div>
    <div class="ledger-table" style="margin-bottom:24px;">
      ${r.orderLines.length === 0 ? `<div class="empty-state">${iconInbox()}<p class="stamp">Bu dönemde teslim edilmiş sipariş yok</p></div>` : `
      <table>
        <thead><tr><th>Sipariş No</th><th>Müşteri</th><th>Alan</th><th>Tahsil</th><th>F Payı</th><th>H Payı</th><th>Alan Payı</th></tr></thead>
        <tbody>
          ${r.orderLines.map(ol => {
            const orderShare = r.netProfit === 0 ? 0 : (ol.revenue / (r.totalRevenue||1)) * r.netProfit;
            const taken = (ol.takenBy||'').trim();
            let fP, hP, aP;
            if(!taken || (taken !== 'F' && taken !== 'H' && taken === '')){
              fP = hP = aP = orderShare/3;
            } else if(taken === 'F'){
              fP = orderShare * 0.75; hP = orderShare * 0.25; aP = 0;
            } else if(taken === 'H'){
              fP = orderShare * 0.25; hP = orderShare * 0.75; aP = 0;
            } else {
              fP = orderShare * 0.25; hP = orderShare * 0.25; aP = orderShare * 0.5;
            }
            return `<tr>
              <td data-label="Sipariş No">${escapeHtml(ol.orderNo||'-')}</td>
              <td data-label="Müşteri" class="cust-name">${escapeHtml(ol.customerName||'-')}</td>
              <td data-label="Alan"><span class="taken-chip">${escapeHtml(ol.takenBy||'?')}</span></td>
              <td data-label="Tahsil"><span class="amount">${fmtMoney(ol.revenue)}</span></td>
              <td data-label="F Payı"><span class="amount net-pos">${fmtMoney(fP)}</span></td>
              <td data-label="H Payı"><span class="amount net-pos">${fmtMoney(hP)}</span></td>
              <td data-label="Alan Payı"><span class="amount net-pos">${fmtMoney(aP)}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="finance-section-title">Gider ve Fire Detayı</div>
    <div class="ledger-table">
      ${r.expenseLines.length === 0 ? `<div class="empty-state">${iconInbox()}<p class="stamp">Bu dönemde gider kaydı yok</p></div>` : `
      <table>
        <thead><tr><th>Tarih</th><th>Kişi</th><th>Açıklama</th><th>Tutar</th></tr></thead>
        <tbody>
          ${r.expenseLines.map(ex => `<tr>
            <td data-label="Tarih">${fmtDate(ex.date)}</td>
            <td data-label="Kişi"><span class="taken-chip">${escapeHtml(ex.person)}</span></td>
            <td data-label="Açıklama">${escapeHtml(ex.description)}</td>
            <td data-label="Tutar"><span class="amount" style="color:var(--rust);">${fmtMoney(ex.amount)}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}
